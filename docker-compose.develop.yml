version: "3.8"

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      auth-database:
        condition: service_healthy
        restart: true
    ports:
      - "80:8000"
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      DEBUG: true
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_HOST: auth-database
      POSTGRES_PORT: 5432
      POSTGRES_DB: auth-database
      POSTGRES_USER: tle-auth
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - secret_key
      - postgres_password
    develop:
      watch:
        - action: rebuild
          path: "Dockerfile"
        - action: rebuild
          path: "docker-compose.develop.yml"
        - action: rebuild
          path: "requirements.txt"
        - action: sync+restart
          path: "."
          target: "/app/"
          initial_sync: true

  auth-database:
    image: postgres:15-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tle-auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: auth-database
      POSTGRES_USER: tle-auth
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

secrets:
  secret_key:
    file: ./.secrets/secret_key.txt
  postgres_password:
    file: ./.secrets/postgres_password.txt
